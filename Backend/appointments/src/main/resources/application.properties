# ---------------------------------------------------------------
# Email (SMTP) - used to send signup verification emails.
# Leave MAIL_USERNAME unset in local dev and MailService will just
# log the verification link to the console instead of sending a
# real email, so signup still works without SMTP credentials.
# ---------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM:no-reply@timesetandbook.com}
# Base URL of the React app, used to build the verification link sent by email.
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# ---------------------------------------------------------------
# SMS (phone OTP) - used to text the signup wizard's phone verification
# code. No provider is wired up yet (no Twilio/SNS/etc. dependency in
# pom.xml) - leave SMS_PROVIDER unset and SmsService will just log the
# code to the console instead of sending a real text, so phone
# verification still works end-to-end in local dev. Wire up a real
# provider's SDK in SmsService and set SMS_PROVIDER (plus that
# provider's own credentials) to send real texts.
# ---------------------------------------------------------------
app.sms.provider=${SMS_PROVIDER:}